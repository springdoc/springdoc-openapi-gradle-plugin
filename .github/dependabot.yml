version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: ['*']
        update-types: [minor, patch]
    # The plugin is compiled with a Java 8 toolchain and Kotlin 1.8: ignore the versions that need a newer Java or Kotlin.
    ignore:
      # Kotlin 2 needs a migration of the build (compilerOptions) and an apiVersion that the oldest supported Gradle
      # can load.
      - dependency-name: 'org.jetbrains.kotlin.jvm'
        update-types: ['version-update:semver-major']
      - dependency-name: 'org.jetbrains.kotlin:*'
        update-types: ['version-update:semver-major']
      # awaitility-kotlin 4.3 is built with Kotlin 2.1, which the Kotlin 1.8 compiler cannot read.
      - dependency-name: 'org.awaitility:awaitility-kotlin'
        versions: ['>=4.3']
      # Jackson 2.20+ is built with Kotlin 2 (jackson-module-kotlin brings kotlin-reflect 2.x, which the Kotlin 1.8
      # compiler cannot read). The Jackson modules align on one version, so cap them all.
      - dependency-name: 'com.fasterxml.jackson.*:*'
        versions: ['>=2.20']
      # klaxon 5.6 needs Java 11.
      - dependency-name: 'com.beust:klaxon'
        versions: ['>=5.6']
      # JUnit 6 needs Java 17.
      - dependency-name: 'org.junit:junit-bom'
        update-types: ['version-update:semver-major']
      # Gradle 9 removed APIs that the current build plugins still use (SelfResolvingDependency): the build fails.
      - dependency-name: 'gradle-wrapper'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
    ignore:
      # gradle/actions 6 moved its caching to a component under separate, non-MIT license terms.
      - dependency-name: 'gradle/actions'
        versions: ['>=6']
