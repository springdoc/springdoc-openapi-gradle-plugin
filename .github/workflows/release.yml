# Cuts a release: sets the version, tags it, publishes to the Gradle Plugin Portal and creates the GitHub release.
# Run it from master. Requires the GRADLE_PUBLISH_KEY and GRADLE_PUBLISH_SECRET secrets (plugins.gradle.org API keys).
name: Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Version to release, e.g. 1.9.1'
        required: true
      dryRun:
        description: 'Rehearse only: validate the publication, no tag, no push, no publish'
        type: boolean
        default: false

# Pushes the release commit and the tag, and creates the GitHub release.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  GRADLE_ARGS: --console=plain -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64 -Porg.gradle.java.installations.auto-download=false
  RELEASE_VERSION: ${{ inputs.releaseVersion }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must be X.Y.Z, got '$RELEASE_VERSION'"; exit 1; }
          if git rev-parse -q --verify "refs/tags/$RELEASE_VERSION" >/dev/null; then
            echo "::error::Tag $RELEASE_VERSION already exists"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            17

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure git
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Set the release version
        run: |
          sed -i -E "s/^version = \"[^\"]+\"/version = \"$RELEASE_VERSION\"/" build.gradle.kts
          grep -n '^version = ' build.gradle.kts

      # build = tests + detekt.
      - name: Build
        run: ./gradlew $GRADLE_ARGS build

      - name: Commit and tag
        run: |
          git add build.gradle.kts
          git diff --cached --quiet || git commit -m "Release $RELEASE_VERSION"
          git tag -a "$RELEASE_VERSION" -m "springdoc-openapi-gradle-plugin $RELEASE_VERSION"

      # Plugin Portal versions cannot be replaced, so publish before pushing anything:
      # if publishing fails, nothing is pushed and the release can be run again.
      - name: Publish to the Gradle Plugin Portal
        run: |
          ./gradlew $GRADLE_ARGS publishPlugins ${{ inputs.dryRun && '--validate-only' || '' }} \
            -Pgradle.publish.key="$GRADLE_PUBLISH_KEY" -Pgradle.publish.secret="$GRADLE_PUBLISH_SECRET"
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}

      - name: Push the release commit and tag
        if: ${{ !inputs.dryRun }}
        run: git push --atomic origin "HEAD:${GITHUB_REF_NAME}" "refs/tags/$RELEASE_VERSION"

      - name: Create the GitHub release
        if: ${{ !inputs.dryRun }}
        run: gh release create "$RELEASE_VERSION" --title "$RELEASE_VERSION" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
